<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satija Paper - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="components.css">
</head>
<body style="overflow: hidden;">
    <div class="login-overlay" id="loginOverlay">
        <div class="login-bg"></div>
        <div class="login-dots"></div>
        <div class="login-card">
            <div id="loginForm">
                <div class="login-brand">
                    <img src="logo.png" class="login-logo">
                    <h1>SATIJA PAPER</h1>
                    <div class="login-brand-url">www.satijapaper.com</div>
                </div>
                <div class="login-error" id="loginError"><i class="fas fa-circle-exclamation"></i><span id="loginErrorMsg"></span></div>
                <div class="login-success" id="loginSuccess"><i class="fas fa-circle-check"></i><span id="loginSuccessMsg"></span></div>
                <div class="login-field">
                    <label>Email</label>
                    <div class="login-input-wrap">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" class="login-input" id="loginUser" placeholder="your@email.com">
                    </div>
                </div>
                <div class="login-field">
                    <label>Password</label>
                    <div class="login-input-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" class="login-input" id="loginPass" placeholder="Enter your password">
                        <button class="toggle-password" type="button" onclick="togglePwd()"><i class="fas fa-eye" id="pwdEye"></i></button>
                    </div>
                </div>
                <button class="login-btn" id="loginBtn" onclick="handleLogin()">Sign In <i class="fas fa-arrow-right"></i></button>
                <div style="text-align:center;margin-top:14px">
                    <a href="#" onclick="forgotPass();return false" style="font-size:11.5px;color:rgba(255,255,255,.38);text-decoration:none;font-weight:600;">Forgot password?</a>
                </div>
            </div>
            <div id="loadingState" class="loading-state" style="display:none">
                <div class="spinner"></div>
                <div style="font-size:13.5px;font-weight:700">Checking session...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, fbFns } from './auth.js';
        
        fbFns.onAuth(auth, (user) => { if(user) window.location.href = 'index.html'; });

        window.handleLogin = async () => {
            const e = document.getElementById('loginUser').value.trim(), p = document.getElementById('loginPass').value;
            if(!e || !p) return alert("Enter email and password.");
            document.getElementById('loginBtn').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            try { await fbFns.signIn(auth, e, p); window.location.href = 'index.html'; }
            catch(err) { document.getElementById('loginErrorMsg').textContent = err.message; document.getElementById('loginError').classList.add('show'); document.getElementById('loginBtn').innerHTML = 'Sign In';}
        };

        window.forgotPass = async () => {
            const e = document.getElementById('loginUser').value.trim();
            if(!e) return alert("Enter your email first.");
            try { await fbFns.resetPass(auth, e); document.getElementById('loginSuccessMsg').textContent = "Reset email sent!"; document.getElementById('loginSuccess').classList.add('show'); }
            catch(err) { alert(err.message); }
        };

        window.togglePwd = () => {
            const i = document.getElementById('loginPass'), ic = document.getElementById('pwdEye');
            if(i.type === 'password'){ i.type = 'text'; ic.className = 'fas fa-eye-slash'; }
            else{ i.type = 'password'; ic.className = 'fas fa-eye'; }
        };
    </script>
</body>
</html>
