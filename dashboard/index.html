<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satija Paper Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="components.css">
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="app-container visible" id="appContainer">
        <div class="sidebar" id="sidebar">
            <div class="brand-box">
                <img src="logo.png" alt="Satija Paper" class="brand-logo">
                <div class="brand-text">SATIJA PAPER</div>
                <div class="brand-sub-tag">SYSTEM MASTER</div>
            </div>
            <div class="sidebar-label" id="navMainLabel">Navigation</div>
            <button class="menu-btn active" id="navAll" onclick="filterCat('All',this)"><i class="fas fa-grid-2"></i> All Processes <span class="count-badge" id="cntAll">0</span></button>
            <button class="menu-btn" id="navSales" onclick="filterCat('Sales',this)"><i class="fas fa-chart-mixed"></i> Sales & CRM <span class="count-badge" id="cntSales">0</span></button>
            <button class="menu-btn" id="navPurchase" onclick="filterCat('Purchase',this)"><i class="fas fa-cart-shopping"></i> Purchase & Inventory <span class="count-badge" id="cntPurchase">0</span></button>
            <button class="menu-btn" id="navManagement" onclick="filterCat('Management',this)"><i class="fas fa-clipboard-check"></i> Management (MIS) <span class="count-badge" id="cntManagement">0</span></button>
            <button class="menu-btn" id="navHR" onclick="filterCat('HR',this)"><i class="fas fa-people-group"></i> HR & Admin <span class="count-badge" id="cntHR">0</span></button>
            <button class="menu-btn" id="navFinance" onclick="filterCat('Finance',this)"><i class="fas fa-indian-rupee-sign"></i> Finance & Accounts <span class="count-badge" id="cntFinance">0</span></button>
            
            <div class="sidebar-label" id="adminNavLabel" style="display:none">Administration</div>
            <button class="menu-btn" id="adminNavBtn" style="display:none" onclick="showAdmin(this)"><i class="fas fa-user-gear"></i> User Management</button>

            <div class="sidebar-user">
                <div class="sidebar-avatar" id="sAvatar">A</div>
                <div class="sidebar-uinfo">
                    <div class="sidebar-uname" id="sName">Admin</div>
                    <div class="sidebar-urole" id="sRole">Admin</div>
                </div>
                <button class="sidebar-logout" onclick="handleLogout()" title="Logout"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </div>

        <div class="main-content">
            <div class="header-bar">
                <h2 class="page-title" id="pageHeader">All Processes</h2>
                <div class="search-wrap" id="searchWrap">
                    <i class="fas fa-magnifying-glass search-icon"></i>
                    <input type="text" class="search-box" placeholder="Search processes..." id="searchInput" oninput="runFilter()">
                </div>
            </div>

            <div class="content">
                <div class="grid" id="cardBox"></div>

                <div class="admin-panel" id="adminPanel">
                    <div class="admin-top">
                        <h3><i class="fas fa-users-gear" style="margin-right:8px;color:var(--accent)"></i>User Management</h3>
                        <button class="add-btn" onclick="openModal()"><i class="fas fa-plus"></i> Add User</button>
                    </div>
                    <div class="tbl-wrap">
                        <table class="tbl">
                            <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Dept Access</th><th>Process Access</th><th>Actions</th></tr></thead>
                            <tbody id="tblBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-bg" id="userModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 id="modalTitle">Add / Edit User</h3>
                <button class="modal-x" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">
                <div class="mf"><label>Display Name</label><input type="text" id="mName"></div>
                <div class="mf"><label>Email</label><input type="email" id="mUser"></div>
                <div class="mf"><label>Role</label>
                    <select id="mRole" onchange="onRoleChange()">
                        <option value="Team Member">Team Member</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-foot">
                <button class="mbtn sec" onclick="closeModal()">Cancel</button>
                <button class="mbtn pri" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, fbFns } from './auth.js';

        const DB=[
  {cat:"Sales",name:"Order to Delivery FMS",pc:"Ms. Preksha",solver:"Mukesh",exec:"Khushi",links:{fms:1,form:1,videoBCI:1}},
  {cat:"Sales",name:"O2D Direct Dispatch FMS",pc:"Ms. Preksha",solver:"Mr. Mukesh",exec:"Khushi",links:{fms:1}},
  {cat:"Sales",name:"Follow Up Calls",pc:"Ms. Neha",solver:"Neha / Pranav",exec:"Neha",links:{sheet:1}},
  {cat:"Sales",name:"Double A Order Form",pc:"Ms. Preksha",solver:"Mr. Pranav",exec:"Mr. Rishabh",links:{form:1,sheet:1}},
  {cat:"Sales",name:"Next Day Market Plan",pc:"Ms. Neha",solver:"Neha / Pranav",exec:"Rishabh / Pawan",links:{form:1,sheet:1}},
  {cat:"Sales",name:"Next Week Marketing Plan",pc:"Ms. Preksha",solver:"Mr. Pranav/Mr. Mukesh",exec:"Sale's Team",links:{form:1,sheet:1}},
  {cat:"Sales",name:"Customer Visit",pc:"Neha",solver:"Neha / Pranav",exec:"Sonu, Pawan, Rishabh",links:{form:1,sheet:1}},
  {cat:"Sales",name:"DA New Distributor Checklist",pc:"Mr. Mukesh",solver:"Mr. Pranav/Ms. Neha",exec:"Mr. Rishabh",links:{form:1,sheet:1}},
  {cat:"Sales",name:"Enquiry Capture FY 2026-27",pc:"Ms. Preksha",solver:"Mr. Pranav/Mr. Mukesh",exec:"Ms. Neha",links:{form:1,sheet:1}},
  {cat:"Sales",name:"Double A CME Payment FMS FY 2026-27",pc:"Ms. Preksha",solver:"Mr. Mukesh",exec:"Mr. Indresh/Sandeep/Mukesh/Ms. Preksha",links:{fms:1,form:1}},
  {cat:"Sales",name:"CRM Payment FMS",pc:"Ms. Preksha",solver:"Mr. Pranav/Mr. Mukesh",exec:"Ms. Pooja",links:{fms:1}},
  {cat:"Sales",name:"Price List",pc:"Ms. Preksha",solver:"Mr. Pranav",exec:"Mr. Mukesh",links:{sheet:1}},
  {cat:"Sales",name:"Stock Dashboard",pc:"Ms. Preksha",solver:"Ravi",exec:"All Sales",links:{stockDash:1}},
  {cat:"Sales",name:"Mr. Mukesh Debtors List",pc:"Ms. Preksha",solver:"Ravi",exec:"Mr. Mukesh",links:{sheet:1}},
  {cat:"Sales",name:"Mr. Pranav Satija Debtors List",pc:"Ms. Preksha",solver:"Ravi",exec:"Mr. Mukesh",links:{sheet:1}},
  {cat:"Purchase",name:"Purchase FMS",pc:"Ms. Preksha",solver:"Neha / Pranav",exec:"Khushi",links:{fms:1,form:1,video:1,videoBCI:1}},
  {cat:"Purchase",name:"IMS (Inventory System)",pc:"Ms. Neha",solver:"Mukesh / Pranav",exec:"Khushi",links:{form:1,sheet:1,video:1}},
  {cat:"Purchase",name:"WMS",pc:"Ms. Neha",solver:"Mr. Mukesh",exec:"Ms. Preksha/Ms. Khushi",links:{form:1,sheet:1}},
  {cat:"Purchase",name:"Stock Transfer FMS",pc:"Ms. Preksha",solver:"Mr. Mukesh",exec:"Mr. Indresh/Sandeep/Ms. Pooja",links:{fms:1,form:1}},
  {cat:"Management",name:"Ultimate Checklist",pc:"Ms. Preksha",solver:"Neha / Pranav",exec:"Khushi",links:{check:1,video:1,dashEmp:1,dashPC:1}},
  {cat:"Management",name:"Delegation Sheet",pc:"Ms. Neha",solver:"Neha / Pranav",exec:"Neha",links:{form:1,sheet:1,video:1}},
  {cat:"Management",name:"To Do (MIS)",pc:"Ms. Neha",solver:"Khushi / Pranav",exec:"Neha / Khushi",links:{form:1,sheet:1}},
  {cat:"Management",name:"To Do (EA)",pc:"Ms. Neha",solver:"Neha / Pranav",exec:"Neha / Pranav",links:{form:1,sheet:1}},
  {cat:"Management",name:"MIS Score",pc:"Ms. Neha",solver:"Ms. Khushi",exec:"Ms. Neha/Ms. Khushi",links:{sheet:1}},
  {cat:"Management",name:"Dashboard of All FMS",pc:"Ms. Preksha",solver:"Ms. Khushi",exec:"All Team Members",links:{dashEmp:1,dashPC:1}},
  {cat:"Management",name:"FMS OF FMS",pc:"Ms. Preksha",solver:"Neha / Pranav",exec:"Khushi",links:{sheet:1,form:1}},
  {cat:"Management",name:"Home Loan FMS",pc:"Ms. Preksha",solver:"Mr. Mukesh",exec:"Mr. Indresh/Saneeep/Ms. Neha/Ms. Preksha",links:{fms:1,form:1}},
  {cat:"Management",name:"eMail & Password Sheet",pc:"MDO",solver:"Ms. Khushi",exec:"Ms. Khushi",links:{sheet:1}},
  {cat:"Support",name:"Help Ticket",pc:"Ms. Preksha",solver:"Khushi/Ravi",exec:"Ravi",links:{form:1,sheet:1}},
  {cat:"My System",name:"Google Site",pc:"Ms. Preksha",solver:"Khushi/Ravi",exec:"Ravi",links:{form:1,sheet:1}},
  {cat:"HR",name:"Office Chores Form",pc:"Ms. Neha",solver:"Neha / Pranav",exec:"Rashmi",links:{form:1,sheet:1}},
  {cat:"HR",name:"Attendances Sheet",pc:"Neha / Preksha",solver:"Neha / Pranav",exec:"All Staff",links:{form:1,sheet:1,admin:1}},
  {cat:"HR",name:"Sales Meeting Attendances Sheet",pc:"Neha / Preksha",solver:"Neha / Pranav",exec:"All Staff",links:{form:1,sheet:1}},
  {cat:"HR",name:"Courier FMS",pc:"Neha",solver:"Neha / Pranav",exec:"Indresh",links:{sheet:1,form:1}},
  {cat:"Finance",name:"Petrol/Rider Form",pc:"Neha / Mukesh",solver:"Neha / Pranav",exec:"Sonu, Pawan...",links:{form:1,sheet:1}},
  {cat:"Finance",name:"Cheque Payment",pc:"Neha / Mukesh",solver:"Mukesh",exec:"Indresh",links:{sheet:1,form:1}},
  {cat:"Finance",name:"Company Payment",pc:"Ms. Preksha",solver:"Mr. Pranav ",exec:"Mr. Sandeep/Ms. Neha",links:{fms:1,form:1}},
  {cat:"Finance",name:"GP Sheet",pc:"Ms. Neha",solver:"Mr. Pranav/Mr. Mukesh",exec:"Ms. Khushi",links:{sheet:1,gpDash:1}},
  {cat:"Finance",name:"Sales Marketing Daily Expense",pc:"Ms. Preksha",solver:"Ms. Neha",exec:"Sale's Team",links:{form:1,sheet:1}},
  {cat:"Family",name:"Satija Family Documents",pc:"Ms. Neha",solver:"Ms. Mukesh",exec:"Ms. Khushi",links:{folder:1}},
];

       let curUser = null, curCat = 'All', cachedUsers = [];
        const $ = id => document.getElementById(id);

        function showToast(msg, type='info') {
            const t = $('toast'); t.textContent = msg; t.className = `toast ${type} show`;
            setTimeout(() => t.className = 'toast', 3000);
        }

        fbFns.onAuth(auth, async (fbUser) => {
            if (!fbUser) return window.location.href = 'login.html';
            const emailId = fbUser.email.toLowerCase().replace(/[^a-z0-9]/g,'_');
            const snap = await fbFns.getDoc(fbFns.doc(db, 'users', emailId));
            curUser = snap.exists() ? {id: emailId, ...snap.data()} : { id: emailId, email: fbUser.email, name: fbUser.email.split('@')[0], role: 'Admin', deptAccess: ['All'] };
            
            $('sAvatar').textContent = curUser.name.charAt(0).toUpperCase();
            $('sName').textContent = curUser.name;
            $('sRole').textContent = curUser.role;
            
            if (curUser.role === 'Admin') {
                $('adminNavLabel').style.display = '';
                $('adminNavBtn').style.display = '';
            }
            runFilter();
        });

        // Dashboard Filters & Render
        window.filterCat = (cat, el) => {
            curCat = cat;
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            $('pageHeader').innerText = cat;
            $('cardBox').style.display = '';
            $('adminPanel').classList.remove('visible');
            runFilter();
        };

        window.runFilter = () => {
            const q = $('searchInput').value.toLowerCase();
            const filtered = DB.filter(it => (curCat === 'All' || it.cat === curCat) && it.name.toLowerCase().includes(q));
            renderCards(filtered);
        };

        function renderCards(data) {
            $('cardBox').innerHTML = data.map(it => `
                <div class="card cat-${it.cat}">
                    <div class="card-inner">
                        <span class="card-tag tag-${it.cat}">${it.cat}</span>
                        <div class="card-title">${it.name}</div>
                        <div class="roles-grid">
                            <div class="role-cell"><div class="role-key">PC</div><div class="role-val">${it.pc}</div></div>
                            <div class="role-cell"><div class="role-key">Solver</div><div class="role-val">${it.solver}</div></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ADMIN PANEL LOGIC
        window.showAdmin = async (el) => {
            if (curUser.role !== 'Admin') return;
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            $('pageHeader').innerText = 'User Management';
            $('cardBox').style.display = 'none';
            $('adminPanel').classList.add('visible');
            await loadUsers();
        };

        async function loadUsers() {
            $('tblBody').innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
            const snap = await fbFns.getDocs(fbFns.collection(db, 'users'));
            cachedUsers = [];
            snap.forEach(d => cachedUsers.push({id: d.id, ...d.data()}));
            $('tblBody').innerHTML = cachedUsers.map(u => `
                <tr>
                    <td>${u.email}</td><td>${u.name}</td><td>${u.role}</td>
                    <td>${u.deptAccess ? u.deptAccess.join(', ') : 'None'}</td>
                    <td>${u.processAccess ? u.processAccess.length : 0} processes</td>
                    <td>
                        <button onclick="editUser('${u.id}')">Edit</button>
                        <button onclick="deleteUserAct('${u.id}')">Del</button>
                    </td>
                </tr>
            `).join('');
        }

        window.openModal = () => { $('userModal').classList.add('show'); };
        window.closeModal = () => { $('userModal').classList.remove('show'); };
        
        window.editUser = (id) => {
            const u = cachedUsers.find(x => x.id === id);
            $('editUserId').value = u.id;
            $('mName').value = u.name;
            $('mUser').value = u.email;
            $('mRole').value = u.role;
            openModal();
        };

        window.saveUser = async () => {
            const id = $('editUserId').value, name = $('mName').value, email = $('mUser').value, role = $('mRole').value;
            const docId = id || email.toLowerCase().replace(/[^a-z0-9]/g,'_');
            await fbFns.setDoc(fbFns.doc(db, 'users', docId), {name, email, role}, {merge: true});
            showToast('User Saved!', 'ok');
            closeModal();
            loadUsers();
        };

        window.deleteUserAct = async (id) => {
            if(!confirm("Delete user?")) return;
            await fbFns.deleteDoc(fbFns.doc(db, 'users', id));
            showToast('User Deleted', 'ok');
            loadUsers();
        };

        window.handleLogout = async () => { await fbFns.signOut(auth); window.location.href = 'login.html'; };
    </script>
</body>
</html>
