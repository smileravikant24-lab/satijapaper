<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satija Paper System Master</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/utility.css">
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-bg"></div>
  <div class="login-dots"></div>
  <div class="login-card">
    <div id="loginForm">
      <div class="login-brand">
        <img src="logo.png" alt="Satija Paper" class="login-logo"
             onerror="this.src='https://via.placeholder.com/86x86?text=SP'">
        <h1>SATIJA PAPER</h1>
        <div class="login-brand-url">www.satijapaper.com</div>
      </div>
      <div class="login-error" id="loginError">
        <i class="fas fa-circle-exclamation"></i><span id="loginErrorMsg"></span>
      </div>
      <div class="login-success" id="loginSuccess">
        <i class="fas fa-circle-check"></i><span id="loginSuccessMsg"></span>
      </div>
      <div class="login-field">
        <label>Email</label>
        <div class="login-input-wrap">
          <i class="fas fa-envelope field-icon"></i>
          <input type="email" class="login-input" id="loginUser" placeholder="your@email.com">
        </div>
      </div>
      <div class="login-field">
        <label>Password</label>
        <div class="login-input-wrap">
          <i class="fas fa-lock field-icon"></i>
          <input type="password" class="login-input" id="loginPass" placeholder="Enter your password">
          <button class="toggle-password" type="button" onclick="togglePwd()">
            <i class="fas fa-eye" id="pwdEye"></i>
          </button>
        </div>
      </div>
      <button class="login-btn" id="loginBtn" onclick="handleLogin()">
        Sign In <i class="fas fa-arrow-right"></i>
      </button>
      <div style="text-align:center;margin-top:14px">
        <a href="#" onclick="forgotPass();return false"
           style="font-size:11.5px;color:rgba(255,255,255,.38);text-decoration:none;font-weight:600;">
          Forgot password?
        </a>
      </div>
    </div>
    <div id="loadingState" class="loading-state" style="display:none">
      <div class="spinner"></div>
      <div style="font-size:13.5px;font-weight:700">Checking session...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- App container is mounted dynamically after login -->
<div class="app-container" id="appContainer"></div>

<!-- Modals container is mounted dynamically after login -->
<div id="modalContainer"></div>

<script type="module" src="js/main.js?v=20261031b"></script>
</body>
</html>
